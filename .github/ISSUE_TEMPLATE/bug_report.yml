name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets or personal data**: no `.env`, tokens, passwords, resumes, or screenshots
        and HTML that show a real profile. Redact before you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, and what led up to it.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `logs/naukri_agent.log`. For a failed application, say which question the form asked.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit (`git rev-parse --short HEAD`), your Python version and Windows version.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Daily run / discovery
        - Scoring and digest
        - Applying through Telegram
        - Phone control / listener / guard
        - Company-site research
        - Weekly report / Excel
        - Setup and docs
        - Other
