name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the project's rules
      description: See CONTRIBUTING.md.
      options:
        - label: A person still approves every application
        - label: It does not bypass CAPTCHA, MFA or anti-bot protection
        - label: The AI does not make decisions that plain code makes today
